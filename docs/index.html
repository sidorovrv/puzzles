<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4CAF50" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Пазлы" />
  <title>Пазлы</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/variables.css?v=20260509-5" />
  <link rel="stylesheet" href="css/app.css?v=20260509-10" />
  <link rel="stylesheet" href="css/puzzle.css?v=20260509-13" />
</head>
<body>
<div id="app">

  <!-- ── Sidebar ──────────────────────────────────── -->
  <nav id="sidebar">
    <div id="sidebar-logo">Пазлы</div>
    <div id="sidebar-nav">
      <!-- Category items injected by home.js -->
    </div>
  </nav>

  <!-- ── Content area ─────────────────────────────── -->
  <div id="content">

    <!-- Home View -->
    <div id="home-view" class="active">
      <div id="home-header">
        <div id="home-category-title">Все пазлы</div>
      </div>
      <div id="card-grid-container">
        <div id="card-grid">
          <!-- Puzzle cards injected by home.js -->
        </div>
      </div>
    </div>

    <!-- Puzzle View -->
    <div id="puzzle-view">
      <div id="puzzle-toolbar">
        <button id="back-btn">← Назад</button>
        <span id="puzzle-title-label"></span>
        <button id="hint-btn">Подсказка</button>
      </div>
      <canvas id="drag-canvas"></canvas>
      <div id="canvas-area">
        <canvas id="assembled-canvas"></canvas>
        <canvas id="float-canvas"></canvas>
        <div id="hint-overlay">
          <img id="hint-img" src="" alt="" />
        </div>
        <canvas id="confetti-canvas"></canvas>
      </div>
      <div id="piece-tray">
        <button id="piece-tray-prev" class="tray-page-btn" type="button" aria-label="Предыдущая страница">‹</button>
        <div id="piece-tray-viewport">
          <div id="piece-tray-track">
            <!-- Tray piece canvases injected by puzzle-render.js -->
          </div>
        </div>
        <button id="piece-tray-next" class="tray-page-btn" type="button" aria-label="Следующая страница">›</button>
      </div>
    </div>

  </div><!-- /content -->
</div><!-- /app -->

<!-- Difficulty Modal -->
<div id="modal-overlay">
  <div id="difficulty-modal">
    <button id="modal-close-btn" aria-label="Закрыть">×</button>
    <div id="modal-preview-frame">
      <img id="modal-preview-img" src="" alt="" />
    </div>
    <div id="modal-body">
      <div id="modal-title"></div>
      <div id="modal-difficulty-label">Выберите сложность:</div>
      <div id="modal-piece-buttons"></div>
      <div id="modal-save-info"></div>
      <button id="modal-start-btn">Начать</button>
    </div>
  </div>
</div>

<script src="js/storage.js?v=20260509-6"></script>
<script src="js/puzzle-engine.js?v=20260509-6"></script>
<script src="js/puzzle-render.js?v=20260509-16"></script>
<script src="js/home.js?v=20260509-14"></script>
<script src="js/app.js?v=20260509-9"></script>
</body>
</html>
