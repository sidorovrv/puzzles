<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Пазлы">
  <meta name="theme-color" content="#4CAF50">
  <title>Пазлы</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="images/icons/icon-192.png">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<!-- First-time setup screen -->
<div id="screen-setup" class="auth-page hidden">
  <div class="auth-logo">🧩</div>
  <div class="auth-app-name">Семейные пазлы</div>
  <p class="auth-greeting">Добро пожаловать!<br>Как вас зовут?</p>
  <div class="setup-form">
    <div>
      <div class="setup-label">Ваше имя</div>
      <input class="setup-input" id="setup-name" type="text" placeholder="Например, Мама" maxlength="20" autocomplete="off">
    </div>
    <div>
      <div class="setup-label">PIN-код (4 цифры)</div>
      <input class="setup-input" id="setup-pin" type="password" inputmode="numeric" placeholder="••••" maxlength="4" autocomplete="new-password">
    </div>
    <div>
      <div class="setup-label">Повторите PIN-код</div>
      <input class="setup-input" id="setup-pin2" type="password" inputmode="numeric" placeholder="••••" maxlength="4" autocomplete="new-password">
    </div>
    <div id="setup-error" class="auth-message"></div>
    <button class="btn-primary" id="setup-submit">Начать</button>
  </div>
</div>

<!-- PIN entry screen -->
<div id="screen-pin" class="auth-page hidden">
  <div class="auth-logo">🧩</div>
  <div class="auth-app-name">Семейные пазлы</div>
  <p class="auth-greeting" id="pin-greeting">Введите PIN-код</p>

  <div class="pin-dots">
    <div class="pin-dot" id="dot-0"></div>
    <div class="pin-dot" id="dot-1"></div>
    <div class="pin-dot" id="dot-2"></div>
    <div class="pin-dot" id="dot-3"></div>
  </div>

  <div class="pin-keypad">
    <button class="pin-key" data-digit="1">1</button>
    <button class="pin-key" data-digit="2">2</button>
    <button class="pin-key" data-digit="3">3</button>
    <button class="pin-key" data-digit="4">4</button>
    <button class="pin-key" data-digit="5">5</button>
    <button class="pin-key" data-digit="6">6</button>
    <button class="pin-key" data-digit="7">7</button>
    <button class="pin-key" data-digit="8">8</button>
    <button class="pin-key" data-digit="9">9</button>
    <button class="pin-key pin-key--zero" data-digit="0">0</button>
    <button class="pin-key pin-key--del" id="pin-del">⌫</button>
  </div>

  <div class="auth-message" id="pin-message"></div>
</div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
