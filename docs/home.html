<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#4CAF50">
  <title>Пазлы</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="images/icons/icon-192.png">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- Top bar -->
<header class="top-bar">
  <div class="top-bar__title">Пазлы</div>
</header>

<!-- ── TAB: Categories ───────────────────────── -->
<div id="tab-categories" class="categories-layout tab-panel">
  <div class="categories-sidebar" id="categories-sidebar">
    <!-- filled by home.js -->
  </div>
  <div class="categories-grid" id="categories-grid">
    <!-- filled by home.js -->
  </div>
</div>

<!-- ── TAB: My Puzzles ───────────────────────── -->
<div id="tab-my" class="page-content tab-panel hidden">
  <div class="section-heading">Мои пазлы</div>
  <div class="puzzle-grid" id="my-grid">
    <!-- filled by home.js -->
  </div>
  <p id="my-empty" class="text-center mt-lg hidden" style="color:var(--color-text-secondary)">
    Вы ещё не начали ни одного пазла.
  </p>
</div>

<!-- Bottom navigation -->
<nav class="bottom-nav">
  <button class="bottom-nav__tab active" data-tab="categories">
    <span class="tab-icon">🧩</span>
    <span>Пазлы</span>
  </button>
  <button class="bottom-nav__tab" data-tab="my">
    <span class="tab-icon">⭐</span>
    <span>Мои пазлы</span>
  </button>
</nav>

<!-- Difficulty modal -->
<div class="modal-backdrop hidden" id="difficulty-modal">
  <div class="modal-sheet">
    <button class="modal-sheet__cancel" id="modal-cancel">Отмена</button>
    <img class="modal-sheet__image" id="modal-img" src="" alt="">
    <div class="modal-sheet__title" id="modal-puzzle-title"></div>
    <div class="difficulty-row" id="difficulty-row">
      <!-- filled by home.js -->
    </div>
    <button class="btn-primary" id="modal-start">Начать</button>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/home.js"></script>
<script src="js/app.js"></script>
</body>
</html>
