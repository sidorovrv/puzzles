<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#4CAF50">
  <title>Пазл</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="images/icons/icon-192.png">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/puzzle.css">
</head>
<body>

<div class="puzzle-page">

  <!-- Top bar -->
  <div class="puzzle-top-bar">
    <button class="puzzle-top-bar__back" id="btn-back">←</button>
    <div class="puzzle-top-bar__title" id="puzzle-title">Пазл</div>
    <div class="puzzle-top-bar__actions">
      <button class="puzzle-top-bar__btn" id="btn-hint" title="Подсказка">👁</button>
      <button class="puzzle-top-bar__btn" id="btn-zoom-in" title="Увеличить">＋</button>
      <button class="puzzle-top-bar__btn" id="btn-zoom-out" title="Уменьшить">－</button>
    </div>
  </div>

  <!-- Progress bar -->
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
  </div>

  <!-- Canvas area -->
  <div class="puzzle-canvas-wrapper" id="canvas-wrapper">
    <canvas id="puzzle-canvas"></canvas>
    <div class="hint-overlay hidden" id="hint-overlay"></div>
  </div>

  <!-- Piece tray -->
  <div class="piece-tray" id="piece-tray">
    <!-- filled by puzzle-render.js -->
  </div>

</div>

<!-- Completion overlay -->
<div class="completion-overlay hidden" id="completion-overlay">
  <div class="completion-card">
    <div class="completion-card__emoji">🎉</div>
    <div class="completion-card__title">Пазл собран!</div>
    <div class="completion-card__reward" id="completion-reward">+900 монет</div>
    <button class="btn-primary" id="btn-completion-home">На главную</button>
  </div>
  <canvas id="confetti-canvas" style="position:fixed;inset:0;pointer-events:none;z-index:299;"></canvas>
</div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/puzzle-engine.js"></script>
<script src="js/puzzle-render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
